<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Fake Review</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050c25a3;: 
            background-size: cover;
            color: white;
            font-family: "Georgia", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.2);
            width: 80%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: "Georgia", serif;
        }

        .predict-btn {
            margin-top: 20px;
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-family: "Georgia", serif;
        }

        .predict-btn:hover {
            background-color: #0073e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake Review Detection</h1>
        <textarea placeholder="Enter your review here..."></textarea>
        <button class="predict-btn">Predict</button>
    </div>
</body>
</html>
