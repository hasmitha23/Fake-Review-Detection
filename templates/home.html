<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Review Detection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('background.webp') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
        }

        .predict-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            position: absolute;
            bottom: 30px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .predict-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

   

    <button class="predict-btn" onclick="location.href='predict.html'">Let's Predict</button>

</body>
</html>
